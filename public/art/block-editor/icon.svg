<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#57534E"/>
      <stop offset="1" stop-color="#1C1917"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0C0A09" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Blocks, not a page: three stacked bars of decreasing width. The editor's
       unit of work is the block, and at thumbnail size a document outline is
       the only thing that still reads. -->
  <g filter="url(#sh)">
    <rect x="104" y="136" width="304" height="48" rx="24" fill="#FFFFFF"/>
    <rect x="104" y="222" width="232" height="42" rx="21" fill="#FFFFFF"/>
    <rect x="104" y="302" width="152" height="42" rx="21" fill="#FFFFFF"/>
  </g>

  <!-- the slash that opens the block menu, sitting where the next block would
       be typed -->
  <g filter="url(#sh)">
    <rect x="316" y="286" width="34" height="132" rx="17" transform="rotate(20 333 352)" fill="#FFFFFF"/>
  </g>
</svg>
