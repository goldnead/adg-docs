<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A1A1AA"/>
      <stop offset="1" stop-color="#3F3F46"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3F3F46" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- three nodes and the wires between them, in the neutral the foundation
       layer wears. Grey on purpose: this is plumbing that two products stand on,
       not a product with a personality of its own. -->
  <rect x="238" y="150" width="36" height="88" rx="18" fill="#FFFFFF" opacity=".55"/>
  <rect x="168" y="300" width="176" height="24" rx="12" fill="#FFFFFF" opacity=".55"/>
  <rect x="168" y="300" width="24" height="34" rx="12" fill="#FFFFFF" opacity=".55"/>
  <rect x="320" y="300" width="24" height="34" rx="12" fill="#FFFFFF" opacity=".55"/>
  <g filter="url(#sh)">
    <rect x="180" y="72" width="152" height="88" rx="26" fill="#FFFFFF"/>
    <rect x="72" y="326" width="152" height="88" rx="26" fill="#FFFFFF"/>
    <rect x="288" y="326" width="152" height="88" rx="26" fill="#FFFFFF"/>
  </g>
</svg>
