<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0245E"/>
      <stop offset="1" stop-color="#5B0A26"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5B0A26" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- A padlock with a play button on its body: a file that plays, but only
       for the one who may open it. The lock alone would have said
       Entitlements (who may access what); the play mark is what this package
       adds, streaming with byte ranges for video.

       Wine red, because the reds (Suppression, Notifications) and pinks
       (Offers, Email Templates) sit on either side of it and the greens and
       blues are taken. -->
  <g filter="url(#sh)">
    <path d="M176 238 V190 A80 80 0 0 1 336 190 V238" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    <rect x="120" y="226" width="272" height="206" rx="40" fill="#FFFFFF"/>
  </g>

  <!-- the play mark, large enough to survive 24 pixels -->
  <path d="M226 280 L226 380 L312 330 Z" fill="url(#bg)" stroke="url(#bg)" stroke-width="16" stroke-linejoin="round"/>
</svg>
